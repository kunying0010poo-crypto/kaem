<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>แนะนำตัวเอง - แก้ม</title>

    <style>
        body {
            font-family: "Tahoma", sans-serif;
            background: linear-gradient(135deg, #ffd6e7, #d6f3ff);
            margin: 0;
            padding: 40px;
            text-align: center;
        }

        .profile {
            background-color: white;
            max-width: 650px;
            margin: auto;
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .profile img {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #ff9fc5;
        }

        h1 {
            color: #ff5c9a;
            margin-bottom: 10px;
        }

        h2 {
            color: #6b9cff;
        }

        p {
            font-size: 18px;
            line-height: 1.8;
        }

        .info {
            background-color: #f5f9ff;
            padding: 20px;
            border-radius: 18px;
            text-align: left;
            margin-top: 20px;
        }

        .info p {
            margin: 10px 0;
        }

        .highlight {
            color: #ff5c9a;
            font-weight: bold;
        }

        .hobby {
            margin-top: 20px;
            padding: 15px;
            background-color: #fff0f6;
            border-radius: 15px;
        }
    </style>
</head>

<body>

    <div class="profile">

        <!-- รูปโปรไฟล์ -->
        <img src="https://instagram.fbkk12-2.fna.fbcdn.net/v/t51.82787-15/810593753_18449880382193994_4439254607804212780_n.jpg?stp=dst-jpg_e35_tt6&_nc_cat=101&_nc_map=urlgen_bucketless&ig_cache_key=Mzk4NjAwNTA2MjgxMDgxODYzMw%3D%3D.3-ccb7-5&ccb=7-5&_nc_sid=58cdad&efg=eyJ2ZW5jb2RlX3RhZyI6IkNBUk9VU0VMX0lURU0ueHBpZHMuMzA3Mi5zZHIucmVndWxhcl9waG90by5DMyJ9&_nc_ohc=kvs6TxlcfCYQ7kNvwF6lO-X&_nc_oc=Adre725hDRvPVLMmqTYgUknIuKSOf41uXbs7LaNHwqB8ZFAMzhoY_zvRNzLqeGg9vxg&_nc_zt=23&_nc_ht=instagram.fbkk12-2.fna&_nc_gid=rPlbFxu9u3VvsYqDQi9jbg&_nc_ss=7baaf&oh=00_AQP3vUKZ1IGL6uAVezieQHDCUHQ_hnJ_yeJXtYcG0oGCOw&oe=6ACB6DC1" alt="รูปของแก้ม">

        <h1>สวัสดีค่ะ 👋</h1>

        <h2>แนะนำตัวเอง</h2>

        <p>
            สวัสดีค่ะ ฉันชื่อ 
            <span class="highlight">นางสาวธนัชพร รัตนกันทา</span>
            <br>
            ชื่อเล่น <span class="highlight">แก้มป่อง</span> 😊
        </p>

        <div class="info">

            <p>
                🎓 <b>มหาวิทยาลัย:</b>
                มหาวิทยาลัยราชภัฎอุตรดิตถ์
            </p>

            <p>
                💻 <b>สาขา:</b>
                คอมพิวเตอร์และเทคโนโลยีดิจิทัลเพื่อการศึกษา
            </p>

            <p>
                📚 <b>ชั้นปี:</b>
                ชั้นปีที่ 3
            </p>

        </div>

        <div class="hobby">

            <h2>🌷 งานอดิเรก</h2>

            <p>
                📖 อ่านหนังสือ &nbsp;
                🎧 ฟังเพลง &nbsp;
                ✈️ ท่องเที่ยว
            </p>

        </div>

        <h2>💗 ขอบคุณที่เข้ามาเยี่ยมชม 💗</h2>

    </div>

</body>
</html>
